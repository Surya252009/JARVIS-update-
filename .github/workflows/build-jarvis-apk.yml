name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source ZIP
        run: |
          unzip -q MY-JARVIS-UPDATED-SOURCE.zip -d android-source
          test -f android-source/settings.gradle.kts
          test -d android-source/app

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android-source assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-app-debug
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
